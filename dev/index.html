<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Invaders Modern</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #0ff;
        font-family: "Courier New", monospace;
        overflow: hidden;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
      .hint {
        position: fixed;
        bottom: 8px;
        left: 8px;
        font-size: 11px;
        color: rgba(0, 255, 255, 0.4);
        pointer-events: none;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hint">ARROWS / A,D = MOVE &nbsp;&nbsp; SPACE = FIRE &nbsp;&nbsp; P = PAUSE &nbsp;&nbsp; ENTER = START</div>
    <script type="module" src="../src/main.ts"></script>
  </body>
</html>
